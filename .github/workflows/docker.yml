# docker — build, CVE-scan and smoke-test the runtime image on every PR and main push; never publish it.
#
# Publishing is release.yml's job, on a version tag only, behind the same Trivy gate. This workflow has
# NO registry login, NO `docker push` and NO `packages: write` permission: it builds the image on the
# ephemeral GitHub-hosted runner (see ci.yml's RUNNERS note), proves it runs, and deletes it. A PR can
# therefore never ship an image, whatever its steps do.
name: docker

on:
  push:
    branches: [main]
  pull_request:

# Read-only. The absence of `packages: write` is the guarantee: even a malicious
# step could not publish the image, because the token has no registry scope.
permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    name: build image (unpublished) + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Build the image (local only — never pushed)
        # A unique local tag per commit; this tag exists only on the runner and is
        # removed below. No registry is contacted.
        run: docker build --pull -t "br0kr:ci-${{ github.sha }}" .

      - name: Scan the image for CRITICAL CVEs (gating)
        # Fails the PR on a fixable CRITICAL in any image layer, before the image
        # could ever be published. ignore-unfixed drops CVEs with no upstream patch
        # (nothing to act on). Third-party action: SHA-pinned per .github/zizmor.yml,
        # the same pin netcanon's gating scan uses.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: br0kr:ci-${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Smoke test (the package imports + runs inside the image)
        run: docker run --rm "br0kr:ci-${{ github.sha }}"

      - name: Remove the local image (tidy; the hosted VM is discarded anyway)
        if: always()
        run: docker image rm "br0kr:ci-${{ github.sha }}" || true
