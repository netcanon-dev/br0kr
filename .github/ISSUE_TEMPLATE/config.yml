# Issue chooser config. Forces use of the templates (no blank issues) and routes
# security reports to the PRIVATE advisory channel — never a public issue. Setup and usage questions use
# the "Question" template (question.md, labelled `question`); Discussions are not enabled on this repo.
blank_issues_enabled: false
contact_links:
  - name: Security or privacy vulnerability
    url: https://github.com/netcanon-dev/br0kr/security/advisories/new
    about: Report security/privacy issues privately. Never open a public issue for a vulnerability, and never paste real secrets or PII.
