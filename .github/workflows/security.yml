# Security — secret scanning + dependency audit.
#
# Complements the working-tree secret scan in the local validate gate with a
# FULL-HISTORY scan (a secret committed and later "removed" still lives in
# history), and audits the dependencies for known CVEs. The weekly schedule
# catches a CVE disclosed against a dependency you didn't touch, or a secret
# already in the tree.
#
# Runs on GitHub-hosted runners (see ci.yml's RUNNERS note). Dependabot bumps
# the actions and requirements.txt; the gitleaks release below is a pinned curl
# URL plus its SHA-256, which Dependabot cannot see, so bump both BY HAND (here
# and in ci.yml).
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'        # weekly, Monday 06:00 UTC

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  gitleaks-history:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # full history, so a secret in ANY past commit is caught
          persist-credentials: false
      - name: Install gitleaks
        run: |
          set -euo pipefail
          # gitleaks: a pinned release, checked against the SHA-256 recorded HERE before it is unpacked (review
          # SEC-04), so a replaced release asset fails the job instead of running. Dependabot cannot see a curl
          # URL: bump by hand, version AND hash together, in lockstep with the other workflow (the hash is the
          # linux_x64 line of that release's gitleaks_<ver>_checksums.txt). tests/unit/test_repo_hygiene.py
          # keeps the two in step.
          GITLEAKS_VERSION=8.18.4
          GITLEAKS_SHA256=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - name: Scan all commits
        # -c .gitleaks.toml allowlists known-safe matches (ciphertext, fixtures);
        # drop the flag if you have no config. --redact keeps secrets out of logs.
        run: gitleaks detect -c .gitleaks.toml --redact --no-banner

  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install --quiet pip-audit
      # requirements.lock.txt — the exact, hashed set the image and CI install (review SEC-03), audited as
      # pinned (--disable-pip: no fresh resolution, so what is audited is what runs). Dependabot proposes
      # the upgrades; pip-audit is the fail-the-build backstop if a CVE lands.
      - run: pip-audit --disable-pip -r requirements.lock.txt
