# CI — the OFFLINE correctness gate.
#
# Runs the SAME validate gate contributors run locally (tests/validate.sh), the
# test matrix, and the real-Postgres harnesses. Nothing here touches live
# infrastructure or credentials: the only database is a throwaway postgres
# service container that dies with the job. Anything that needs live
# infrastructure stays out of CI (run it on the deploy host / a dedicated
# environment). Keeping CI offline is what makes "green in CI" a trustworthy
# signal and keeps every PR fast.
#
# RUNNERS: GitHub-hosted (ubuntu-latest), deliberately — in every workflow. This
# repo is public and CI runs on `pull_request`, so a FORK's PR executes here. On
# a self-hosted runner that means a stranger's code runs on the maintainer's own
# network (next to the hypervisors and the ledger this project manages). Hosted
# runners are ephemeral and isolated. Keep self-hosted runners for PRIVATE repos
# only; nothing here needs them, because the gate is hermetic (above).
name: ci

on:
  push:
    branches: [main]          # main — add 'master' if that's your default
  pull_request:
  # Weekly, and on demand: the same jobs, with the harness job running EVERY ledger harness rather than the
  # PR set, so a harness that rots (a seed the schema outgrew, a fake missing a new driver call) goes red within
  # a week instead of waiting for someone to run it by hand (review TEST-02).
  schedule:
    - cron: '30 6 * * 1'      # Monday 06:30 UTC
  workflow_dispatch:

# Default-deny the GITHUB_TOKEN. Every job below is read-only (lint + tests);
# none push to the repo, publish a package, or write a release. A compromised
# step (a typo-squatted action, a malicious transitive dep pulled by pip)
# inherits only read scope. Grant more on the ONE job that needs it, never here.
permissions:
  contents: read

# Collapse superseded runs on the same ref — push twice and the first run is
# cancelled. Saves runner minutes; avoids an older commit's stale green racing
# the new one.
concurrency:
  # The event is part of the key, so the weekly run on main and a push to main never cancel each other.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # Opt JS actions into the Node24 runtime ahead of GitHub's forced cutover
  # (Node20 deprecation, 2025-09 → mid-2026). Surfaces any incompatibility now
  # rather than at the deadline. Remove once the runners default to Node24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate:
    name: validate (lint · secrets · syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Clear the token-in-.git/config default; this job never pushes, so
          # there's no reason to leave a credential on disk for a later step
          # (or a malicious dep) to read.
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'   # the version used to RUN the linters; the
          cache: pip               # test job below covers the Python versions

      - name: Install lint toolchain (pinned for determinism)
        # Pin the linter so an unrelated PR doesn't go red because a new ruff
        # minor added a rule. Bump deliberately via Dependabot.
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # The runtime dependencies from the hashed lock first (review SEC-03), then the dev tools on top;
          # requirements-dev.txt's `-r ../requirements.txt` is then already satisfied by the locked versions.
          pip install --require-hashes -r requirements.lock.txt
          pip install -r tests/requirements-dev.txt
          # gitleaks: a pinned release, checked against the SHA-256 recorded HERE before it is unpacked (review
          # SEC-04), so a replaced release asset fails the job instead of running. Dependabot cannot see a curl
          # URL: bump by hand, version AND hash together, in lockstep with the other workflow (the hash is the
          # linux_x64 line of that release's gitleaks_<ver>_checksums.txt). tests/unit/test_repo_hygiene.py
          # keeps the two in step.
          GITLEAKS_VERSION=8.18.4
          GITLEAKS_SHA256=ba6dbb656933921c775ee5a2d1c13a91046e7952e9d919f9bac4cec61d628e7d
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks

      - name: validate (the same gate as local)
        # tests/validate.sh is the single source of truth for "is it green":
        # contributors run it before commit, CI runs it here. --strict makes a
        # missing tool a failure (in CI every tool must be present; locally it
        # degrades gracefully). BR0KR_SKIP_UNIT: the test job below runs the
        # suite, so a PR runs it once, not twice; validate then runs only the
        # repo-hygiene tests, which pin that job (review TEST-06).
        env:
          BR0KR_SKIP_UNIT: '1'
        run: bash tests/validate.sh --strict

  test:
    name: tests — py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      # Don't let one Python version's failure hide the others — we want to see
      # the full pass/fail grid on a red run.
      fail-fast: false
      matrix:
        # A pull request runs 3.13 alone: the Python the image ships (Dockerfile
        # `FROM python:3.13-slim`), so the only one in production (review
        # TEST-06). A push to main, the weekly run and a manual run test the
        # whole support range, which must match pyproject.toml's
        # `requires-python` and version classifiers, so a break on an older
        # Python shows within minutes of a merge. The main ruleset requires only
        # `tests — py3.13`. CONVENTION: if you exclude a version (no wheel yet,
        # upstream gap), leave a comment HERE saying why and when to re-add it,
        # so the gap is documented at the point of truth.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.13"]' || '["3.11", "3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install runtime + test deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # The runtime dependencies from the hashed lock first (review SEC-03), then the dev tools on top;
          # requirements-dev.txt's `-r ../requirements.txt` is then already satisfied by the locked versions.
          pip install --require-hashes -r requirements.lock.txt
          pip install -r tests/requirements-dev.txt

      - name: pytest (offline — e2e/slow excluded; the hermetic default)
        # The PR gate runs the fast, hermetic tiers. Slow/e2e tiers (real
        # browser, live service) run in a dedicated job or out-of-band so the
        # gate stays fast. Coverage targets the br0kr package, and the step
        # fails below pyproject.toml's `fail_under` floor (review TEST-05).
        run: pytest -m "not e2e and not slow" --cov=br0kr --cov-report=term-missing --cov-report=xml

      - name: keep the coverage report
        # coverage.xml as a run artifact (no third-party service): download it
        # from the run page to see which lines a PR left uncovered. One leg is
        # enough; the total is the same on every supported Python.
        if: ${{ !cancelled() && matrix.python == '3.13' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python }}
          path: coverage.xml
          if-no-files-found: warn
          retention-days: 30

  harness:
    # The race and saga proofs need a real Postgres: the unit suite stubs the
    # advisory locks and the CAS predicates, so a refactor that breaks them would
    # otherwise go green here. scripts/_harness.py holds and describes the set
    # (CI_SET), gives each harness a fresh database and caps its wall clock.
    name: harness — real Postgres
    runs-on: ubuntu-latest
    # The PR set takes about 3 minutes on a 4-vCPU host, every harness about 8; these are the backstops.
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 30 || 15 }}
    services:
      postgres:
        image: postgres:16
        env:
          # A throwaway service container on a hosted runner, gone when the job
          # ends. Not a credential: nothing else can reach it.
          POSTGRES_PASSWORD: broker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h localhost -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: broker
      # The service container is a throwaway: the runner refuses a libpq server without this.
      BR0KR_THROWAWAY_PG: '1'
      # The lock is installed below; run with it instead of building the runner's venv.
      BR0KR_HARNESS_PYTHON: python
      # Pushes and PRs run the CI set; the weekly and manual runs run every ledger harness.
      HARNESS_SET: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '--all' || '--ci' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install runtime deps
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock.txt   # the hashed lock (review SEC-03)

      - name: Run the real-Postgres harnesses (each on a fresh database)
        run: bash scripts/run_harness.sh "${HARNESS_SET}"

      - name: Run ledger_ha in a container of its own (weekly; it restarts its server)
        # The service container cannot be restarted by a step, so the run above skips ledger_ha; without the
        # opt-in the runner starts a postgres container for it (the hosted runner has Docker).
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: env -u BR0KR_THROWAWAY_PG bash scripts/run_harness.sh ledger_ha

  alert-rules:
    # The shipped Prometheus rules: promtool checks them and runs their unit tests
    # (each alert fires on its condition, stays quiet on the near-misses). The
    # image is digest-pinned in the script; Dependabot cannot see it, so bump it there.
    name: alert rules (promtool)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: promtool check + test the alert rules
        run: bash scripts/check_alert_rules.sh
