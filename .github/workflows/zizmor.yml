# zizmor — GitHub-Actions workflow-security scan.
#
# Audits .github/ for GHA-specific supply-chain anti-patterns the rest of the
# pipeline doesn't model: template injection via ${{ github.event.* }} in run:
# blocks, over-broad permissions:, untrusted checkout, secrets leaking to forks
# via pull_request_target, and unpinned third-party actions. The action-pinning
# policy lives in .github/zizmor.yml.
#
# BLOCKING + SARIF: br0kr is public, so Code scanning is available. Findings at
# `medium` and above fail the job and land in Security -> Code scanning under the
# `zizmor` category, next to CodeQL. (A PRIVATE repo on the free plan has no
# Code scanning: it runs zizmor from pip with SARIF off instead — see
# docs/standards/ci-cd.md, "Repository baseline".)
name: zizmor — GHA workflow security scan

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
      - '.github/zizmor.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
      - '.github/dependabot.yml'
      - '.github/zizmor.yml'
  schedule:
    # Weekly — zizmor ships new rules often; a workflow clean last month can have
    # a finding today. Monday early-UTC, before the weekly Dependabot cadence.
    - cron: '17 4 * * 1'
  workflow_dispatch:

# Read-only by default; the one job elevates only what the SARIF upload needs.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  zizmor:
    name: zizmor scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # SARIF upload to Code scanning
      actions: read            # zizmor reads workflow files via the API
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run zizmor (blocking; policy in .github/zizmor.yml)
        # The action publishes no v0 major alias: SHA-pinned (third-party
        # publisher -> hash-pin per .github/zizmor.yml), bumped by Dependabot.
        # The same pin netcanon uses.
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          min-severity: medium   # medium+ blocks; informational nudges don't
